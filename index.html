<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Forest Game</title>
  </head>
  <body>
    <div id="app">
      <main id="map">
        <canvas id="world"></canvas>
        <header id="hud">
          <div class="stats frame parchment" tabindex="0" role="region" aria-label="Resources and population; scroll horizontally for more stats">
            <span title="Population"><i class="ico ico-pop"></i><b id="pop">0/5</b></span>
            <span title="Land, and trees left to fell before the next relic appears"><i class="ico ico-land"></i><b id="land">0</b><small id="relicCountdown"></small></span>
            <span id="seasonChip" class="stack" tabindex="0" role="button" aria-label="Season effects" aria-expanded="false" aria-controls="seasonInfo"><b id="season">Spring</b><span class="season-bar" role="progressbar" aria-label="Season progress" aria-valuemin="0" aria-valuemax="100"><i id="seasonBar"></i></span></span>
            <span id="shortage" class="stack alert" hidden><b></b><small></small></span>
          </div>
          <div id="seasonInfo" class="frame parchment" role="tooltip" hidden></div>
          <div id="resourceInfo" class="frame parchment" role="tooltip" hidden></div>
        </header>
        <p id="msg" class="frame parchment"></p>
        <div id="toasts" role="status" aria-live="polite"></div>
      </main>
      <aside id="side">
        <section id="tutorial" class="frame parchment" aria-label="Tutorial" hidden>
          <div class="tutorial-head"><small></small><button class="tutorial-skip"></button></div>
          <h3></h3>
          <p aria-live="polite"></p>
        </section>
        <div id="tools">
          <button id="pickSkillBtn" class="gold" hidden><i class="ico ico-skills"></i><span></span></button>
          <button id="nextUpBtn" class="next-up parchment" aria-haspopup="dialog" aria-controls="achievementsModal" hidden></button>
        </div>
        <section id="panel"></section>
        <nav id="menu">
          <button id="skillsBtn" aria-haspopup="dialog" aria-controls="skillModal" aria-expanded="false"><i class="ico ico-skills"></i>Skills</button>
          <button id="legacyBtn" aria-haspopup="dialog" aria-controls="legacyModal" aria-expanded="false"><i class="ico ico-relic"></i>Legacy</button>
          <button id="guideBtn" aria-haspopup="dialog" aria-controls="guideModal" aria-expanded="false"><i class="ico ico-scroll"></i>Guide</button>
          <button id="achievementsBtn" aria-haspopup="dialog" aria-controls="achievementsModal" aria-expanded="false"><i class="ico ico-trophy"></i>Achievements</button>
          <button id="soundBtn" aria-label="Sound" aria-pressed="true"><i class="ico ico-sound"></i></button>
          <button id="musicBtn" aria-label="Music" aria-pressed="true"><i class="ico ico-music"></i></button>
          <button id="exportBtn" title="Export save" aria-label="Export save"><i class="ico ico-export"></i></button>
          <button id="importBtn" title="Import save" aria-label="Import save"><i class="ico ico-import"></i></button>
          <div id="devTools" role="group" aria-label="Developer tools" hidden>
            <span class="dev-tag">DEV</span>
            <button id="devTap" class="dev"></button>
            <button id="devSpeed" class="dev"></button>
            <button id="devReset" class="dev">Reset</button>
          </div>
          <input id="importFile" type="file" accept=".json,application/json" hidden />
        </nav>
      </aside>
    </div>
    <dialog id="skillModal" class="frame dark" aria-labelledby="skillTitle">
      <div class="skill-header">
        <h2 id="skillTitle">Skills</h2>
        <div class="skill-tabs" role="group" aria-label="Skill views">
          <button data-skill-view="all" aria-pressed="true">Skill tree</button>
          <button data-skill-view="choose" aria-pressed="false" disabled>Choose a skill (0)</button>
        </div>
        <p class="skill-summary"></p>
        <button class="close" aria-label="Close">×</button>
      </div>
      <div class="skill-layout">
        <div class="skill-gallery" role="group" aria-label="Skill tree"></div>
        <div class="skill-detail-slot"></div>
      </div>
      <p class="skill-feedback" role="status" aria-live="polite"></p>
    </dialog>
    <dialog id="legacyModal" class="frame dark" aria-labelledby="legacyTitle">
      <div class="skill-header">
        <h2 id="legacyTitle">Legacy</h2>
        <p class="skill-summary"></p>
        <button class="close" aria-label="Close">×</button>
      </div>
      <div class="skill-layout">
        <div class="skill-gallery" role="group" aria-label="Legacy perks"></div>
        <div class="skill-detail-slot"></div>
      </div>
    </dialog>
    <dialog id="guideModal" class="frame dark" aria-labelledby="guideTitle">
      <div class="skill-header">
        <h2 id="guideTitle">Buildings</h2>
        <p class="skill-summary"></p>
        <button class="close" aria-label="Close">×</button>
      </div>
      <ul class="guide-list" aria-label="Every building and what it does"></ul>
    </dialog>
    <dialog id="achievementsModal" class="frame dark" aria-labelledby="achievementsTitle">
      <div class="skill-header">
        <h2 id="achievementsTitle">Achievements</h2>
        <p class="skill-summary"></p>
        <button class="close" aria-label="Close">×</button>
      </div>
      <div class="ach-body"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
