<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Forest Game</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stats">
          <span>Wood <b id="wood">0</b><small id="woodRate"></small></span>
          <span>Food <b id="food">0</b><small id="foodRate"></small></span>
          <span>Pop <b id="pop">0/5</b></span>
          <span>Land <b id="land">0</b></span>
          <span>Trees <b id="trees">0</b></span>
        </div>
        <div class="tools">
          <button data-tool="chop">Chop</button>
          <button data-tool="mark">Mark</button>
          <span id="relic"></span>
          <button id="findRelic" hidden>Find relic</button>
        </div>
        <p id="msg"></p>
      </header>
      <canvas id="world"></canvas>
      <footer id="panel"></footer>
      <nav id="menu">
        <button id="skillsBtn">Skills</button>
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
        <button id="devTap" hidden></button>
        <input id="importFile" type="file" accept=".json,application/json" hidden />
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
